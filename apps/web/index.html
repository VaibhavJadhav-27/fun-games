<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b14" />
    <meta name="description" content="Party games for friends in the same room. No install, no accounts." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Party Games</title>
    <script>
      // Apply the saved or system theme before first paint (no flash). Mirrors src/theme/theme.ts.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('pg:theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
        if (theme === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f5fa');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
